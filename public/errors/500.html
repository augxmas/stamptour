<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일시적인 서버 오류</title>
<style>
  :root{--ink:#171923;--muted:#667085;--line:#d7dde8;--soft:#f7f9fc;--brand:#2563eb;--accent:#16a34a;--danger:#dc2626;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8fbff 0%,#f2f7f4 52%,#fff5f5 100%);display:flex;align-items:center;justify-content:center;padding:28px}
  main{width:min(940px,100%);display:grid;grid-template-columns:.95fr 1.05fr;gap:38px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;color:#344054;font-weight:800;font-size:15px;margin-bottom:30px}
  .brand img{width:34px;height:34px}
  .eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--danger);text-transform:uppercase;margin-bottom:14px}
  h1{margin:0;font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:0}
  p{font-size:17px;line-height:1.75;color:var(--muted);margin:18px 0 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  a,button{height:46px;border-radius:8px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer}
  .primary{background:var(--brand);color:#fff;box-shadow:0 12px 26px rgba(37,99,235,.22)}
  .secondary{background:#fff;color:#344054;border-color:var(--line)}
  .visual{position:relative;min-height:388px;border:1px solid rgba(24,32,51,.08);border-radius:8px;background:rgba(255,255,255,.68);box-shadow:0 24px 70px rgba(16,24,40,.12);overflow:hidden}
  .panel{position:absolute;left:34px;right:34px;top:34px;bottom:34px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
  .top{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;background:#f8fafc}
  .dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.dot.red{background:#ef4444}.dot.green{background:#22c55e}
  .status{position:absolute;left:30px;right:30px;top:92px;display:grid;gap:12px}
  .bar{height:14px;border-radius:999px;background:#eef2f7;overflow:hidden}
  .bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--brand))}
  .bar:nth-child(1) span{width:74%}.bar:nth-child(2) span{width:42%;background:linear-gradient(90deg,#f59e0b,var(--danger))}.bar:nth-child(3) span{width:62%}
  .code{position:absolute;left:30px;right:30px;bottom:78px;font-size:90px;font-weight:950;color:#101828;letter-spacing:0}
  .message{position:absolute;left:30px;right:30px;bottom:28px;color:#475467;font-size:14px;line-height:1.55}
  @media(max-width:760px){body{align-items:flex-start;padding:24px 18px}main{grid-template-columns:1fr;gap:28px}.brand{margin-bottom:24px}.visual{min-height:310px;order:2}.code{font-size:68px}}
</style>
</head>
<body>
<main>
  <section>
    <div class="brand"><img src="/favicon-blue.svg" alt="">MONORAMA Tracker</div>
    <div class="eyebrow">500 Internal Server Error</div>
    <h1>요청을 처리하는 중 문제가 발생했습니다.</h1>
    <p>잠시 후 다시 시도해 주세요. 같은 문제가 계속되면 관리자에게 현재 접속 주소와 발생 시간을 알려 주세요.</p>
    <div class="actions">
      <button class="primary" type="button" onclick="location.reload()">다시 시도</button>
      <a class="secondary" href="/landing/20260623_0001/">메인으로 이동</a>
    </div>
  </section>
  <section class="visual" aria-hidden="true">
    <div class="panel">
      <div class="top"><span class="dot red"></span><span class="dot"></span><span class="dot green"></span></div>
      <div class="status"><div class="bar"><span></span></div><div class="bar"><span></span></div><div class="bar"><span></span></div></div>
      <div class="code">500</div>
      <div class="message">서버가 요청을 끝까지 처리하지 못했습니다. 데이터는 자동으로 복구 흐름을 기다리는 중입니다.</div>
    </div>
  </section>
</main>
</body>
</html>
