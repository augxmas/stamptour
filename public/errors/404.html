<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없습니다</title>
<style>
  :root{--ink:#182033;--muted:#667085;--line:#d9e1ec;--soft:#f4f8fb;--brand:#16a34a;--brand2:#2563eb;--warn:#f59e0b;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7fbff 0%,#eef8f0 48%,#fff7ed 100%);display:flex;align-items:center;justify-content:center;padding:28px}
  main{width:min(920px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
  .brand{display:flex;align-items:center;gap:10px;color:#344054;font-weight:800;font-size:15px;margin-bottom:30px}
  .brand img{width:34px;height:34px}
  .eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--brand);text-transform:uppercase;margin-bottom:14px}
  h1{margin:0;font-size:clamp(34px,6vw,62px);line-height:1.04;letter-spacing:0}
  p{font-size:17px;line-height:1.75;color:var(--muted);margin:18px 0 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  a,button{height:46px;border-radius:8px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer}
  .primary{background:var(--brand);color:#fff;box-shadow:0 12px 26px rgba(22,163,74,.22)}
  .secondary{background:#fff;color:#344054;border-color:var(--line)}
  .visual{position:relative;min-height:380px;border:1px solid rgba(24,32,51,.08);border-radius:8px;background:rgba(255,255,255,.62);box-shadow:0 24px 70px rgba(16,24,40,.12);overflow:hidden}
  .map{position:absolute;inset:30px;background:linear-gradient(90deg,rgba(37,99,235,.08) 1px,transparent 1px),linear-gradient(rgba(37,99,235,.08) 1px,transparent 1px);background-size:34px 34px;border-radius:8px}
  .route{position:absolute;left:70px;right:70px;top:158px;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px}
  .pin{position:absolute;width:48px;height:48px;border-radius:50% 50% 50% 12px;transform:rotate(-45deg);background:#fff;border:3px solid var(--brand);box-shadow:0 12px 30px rgba(22,163,74,.22)}
  .pin:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--brand)}
  .pin.one{left:64px;top:136px}
  .pin.two{right:64px;top:136px;border-color:var(--warn)}
  .pin.two:after{background:var(--warn)}
  .code{position:absolute;left:50%;top:62px;transform:translateX(-50%);font-size:88px;font-weight:950;color:#101828;letter-spacing:0}
  .note{position:absolute;left:34px;right:34px;bottom:34px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;color:#475467;font-size:14px;line-height:1.65}
  @media(max-width:760px){body{align-items:flex-start;padding:24px 18px}main{grid-template-columns:1fr;gap:28px}.brand{margin-bottom:24px}.visual{min-height:300px}.code{font-size:68px}.route{left:52px;right:52px}.pin.one{left:44px}.pin.two{right:44px}}
</style>
</head>
<body>
<main>
  <section>
    <div class="brand"><img src="/favicon-green.svg" alt="">MONORAMA Tracker</div>
    <div class="eyebrow">404 Not Found</div>
    <h1>요청하신 페이지를 찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나, 삭제되었거나, 링크가 잘못 입력되었을 수 있습니다. 메인 랜딩으로 돌아가 다시 이동해 주세요.</p>
    <div class="actions">
      <a class="primary" href="/landing/20260623_0001/">메인으로 이동</a>
      <button class="secondary" type="button" onclick="history.length > 1 ? history.back() : location.href='/'">이전 화면</button>
    </div>
  </section>
  <section class="visual" aria-hidden="true">
    <div class="map"></div>
    <div class="code">404</div>
    <div class="route"></div>
    <div class="pin one"></div>
    <div class="pin two"></div>
    <div class="note">찾으려는 경로가 현재 서비스 지도에 없습니다. URL을 확인하거나 메인 화면에서 다시 시작해 주세요.</div>
  </section>
</main>
</body>
</html>
